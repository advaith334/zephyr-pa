# Enable I2C support
CONFIG_I2C=y

# Enable sensor subsystem
CONFIG_SENSOR=y

# Enable SHT4x sensor driver
CONFIG_SHT4X=y

# Enable console and logging
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Enable UART for console output
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Enable GPIO if needed for sensor power control
CONFIG_GPIO=y

# Enable main thread
CONFIG_MAIN_THREAD_PRIORITY=5
CONFIG_MAIN_STACK_SIZE=1024

# Enable floating point support for sensor readings
CONFIG_FPU=y

# Enable system workqueue for sensor operations
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

# Use newlib instead of picolibc to avoid compatibility issues
CONFIG_MINIMAL_LIBC=y
CONFIG_PICOLIBC=n
